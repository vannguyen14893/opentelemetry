server:
  port: 8089
logging:
  level:
    com.example: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    SQL_TRACE: INFO
    io.opentelemetry: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}/%X{spanId}] %-5level %logger{36} - %msg%n"
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:8200}
  endpoint:
    prometheus:
      access: unrestricted
  tracing:
    sampling:
      probability: 1.0
    baggage:
      enabled: false
    propagation:
      type: w3c
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/test
    username: admin
    password: 123456A@
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 10000
          optimize_batch_fetch_size: 5000
  kafka:
    bootstrap-servers: localhost:29092
  application:
    name: service-a
    version: 1.0.0
  data:
    redis:
      port: 6379
      host: localhost
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
grpc:
  server:
    port: 9092
