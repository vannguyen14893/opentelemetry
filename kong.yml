_format_version: "3.0"
_transform: true

upstreams:
  - name: service-a-upstream
    algorithm: round-robin
    slots: 1000
    targets:
      - target: service-a:8089
        weight: 100

  - name: service-b-upstream
    algorithm: round-robin
    slots: 1000
    targets:
      - target: service-b:8081
        weight: 100

services:
  - name: service-a
    host: service-a-upstream
    protocol: http
    port: 8089
    tags: [ service-a ]
  - name: service-b
    host: service-b-upstream
    protocol: http
    port: 8081
    tags: [ service-b ]
  - name: service-a-grpc
    host: service-a-upstream
    protocol: grpc
    port: 8089
    tags: [ service-a, grpc ]
consumers:
  - username: jwt-mobile
    acls:
      - group: super-admin
      - group: user
    tags: [ jwt, mobile ]
    jwt_secrets:
      - key: "mobile-app-issuer"
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAy1bHc/i3wLyq5sTKyN7g
          aoCe78bWFD1dFaVdSFzvOlRvrc/VAaX3HQKtBhC09EPiDQU39KTvcAGuM1grRjSB
          fnWRXOWCR+vsOa8v6MlpJqZPxu18fg+NLZKCXw0nhBt3H3WeSbCtVIYByEQ3hHYE
          DRFNN/5wb2mQ+l5J4nNxrWoxYf5Y4ooGyoAltlEcj5XqVXN8cmz1t8anCQqZDXTW
          cZ02bimwoqmk9RUoAH0fOa7NZMA6X7xE1aqgPWD9n/6Gu6Ny5aldlqfSLF8H2Fa2
          II80VWXf5yAP9KshTwtZto70NhJFqyDsaia8vd0nldP0ovNyS2YYx9Nt7VVyGcbn
          5wIDAQAB
          -----END PUBLIC KEY-----
  - username: anonymous-user
    acls:
      - group: anonymous
routes:
  - name: service-a-route
    service: service-a
    paths: [ "/service-a" ]
    methods: [ POST, GET, PUT, DELETE, UPDATE ]
    strip_path: true
    plugins:
      - name: acl
        config:
          allow:
            - user
          hide_groups_header: false
  - name: service-b-route
    service: service-b
    paths: [ "/service-b" ]
    methods: [ POST,GET, PUT, DELETE, UPDATE ]
    strip_path: true
    plugins:
      - name: jwt
        config:
          anonymous: "anonymous-user"
  - name: service-a-http-to-grpc
    service: service-a-grpc
    protocols:
        - http
        - https
    paths:
        - "/service-a-grpc"
    strip_path: true
plugins:
  - name: cors
    config:
      origins: [ "http://localhost:3000", "https://example.com" ]
      methods: [ GET, POST, PUT, DELETE, OPTIONS ]
      headers: [ Accept, Authorization, Content-Type ]
  - name: jwt
    config:
      claims_to_verify: [ exp ]
      key_claim_name: iss
      secret_is_base64: false
      run_on_preflight: false
      header_names: [ authorization ]
  - name: opentelemetry
    config:
      traces_endpoint: http://apm-server:8200/v1/traces
      batch_span_count: 100
      batch_flush_delay: 5
      propagation:
        default_format: w3c
        extract:
          - w3c
          - b3
        inject:
          - w3c
          - b3
      resource_attributes:
        service.name: kong-gateway
        service.version: "1.0"
        deployment.environment: "development"
      headers:
        Authorization: "Bearer fzd4MJLyPLSXZ0oUj7-hzPrtxGC8rKHhTbMKO6wVThVcRib8w5r4Jdt00BzAX-UT-shurF0vtQJLeK3qMqRnPA"