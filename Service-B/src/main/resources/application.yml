server:
  port: 8081
logging:
  level:
    com.example: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}/%X{spanId}] %-5level %logger{36} - %msg%n"
management:
  zipkin:
      tracing:
        endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
    baggage:
      enabled: false
    propagation:
      type: w3c
grpc:
  server:
    port: 9091
  client:
    hello:
      address: localhost:9090
      negotiation-type: plaintext
spring:
  application:
    name: service-b
    version: 1.0.0

